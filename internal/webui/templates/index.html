<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OQM - OpenWrt Quota Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .card {
            @apply bg-white rounded-lg shadow-md p-6;
        }
        .status-active {
            @apply bg-green-100 text-green-800 px-2 py-1 rounded text-xs font-semibold;
        }
        .status-blocked {
            @apply bg-red-100 text-red-800 px-2 py-1 rounded text-xs font-semibold;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-blue-600 text-white shadow-lg">
            <div class="container mx-auto px-4 py-6">
                <div class="flex justify-between items-center">
                    <div>
                        <h1 class="text-3xl font-bold">OQM Dashboard</h1>
                        <p class="text-blue-100">OpenWrt Quota Manager</p>
                    </div>
                    <button onclick="showSettingsModal()" class="bg-blue-700 hover:bg-blue-800 text-white px-4 py-2 rounded-lg flex items-center gap-2">
                        ⚙️ Settings
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="container mx-auto px-4 py-8">
            <!-- Stats Cards -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="card"><h3 class="text-gray-500 text-sm font-semibold uppercase">Total Users</h3><p class="text-3xl font-bold text-gray-800 mt-2" id="total-users">0</p></div>
                <div class="card"><h3 class="text-gray-500 text-sm font-semibold uppercase">Active Users</h3><p class="text-3xl font-bold text-green-600 mt-2" id="active-users">0</p></div>
                <div class="card"><h3 class="text-gray-500 text-sm font-semibold uppercase">Blocked Users</h3><p class="text-3xl font-bold text-red-600 mt-2" id="blocked-users">0</p></div>
                <div class="card"><h3 class="text-gray-500 text-sm font-semibold uppercase">Total Traffic</h3><p class="text-3xl font-bold text-blue-600 mt-2" id="total-traffic">0 GB</p></div>
            </div>

            <!-- Users Table -->
            <div class="card">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">Users</h2>
                    <div class="flex gap-2">
                        <button onclick="manualRefresh()" class="bg-gray-600 text-white px-4 py-2 rounded hover:bg-gray-700 flex items-center gap-2" id="refreshBtn"><span>🔄</span><span>Refresh</span></button>
                        <button onclick="showDHCPModal()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">📡 DHCP Clients</button>
                        <button onclick="showAddUserModal()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">+ Add User</button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Connection</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">IP / MAC</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Quota</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider hidden">⬇️ Download</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider hidden">⬆️ Upload</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Total</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Usage %</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body" class="bg-white divide-y divide-gray-200"><!-- Users will be loaded here --></tbody>
                    </table>
                </div>
            </div>

            <!-- Top Users Chart -->
            <div class="card mt-8"><h2 class="text-2xl font-bold text-gray-800 mb-4">Top Users by Traffic</h2><canvas id="topUsersChart" height="80"></canvas></div>
        </main>
    </div>

    <!-- DHCP Clients Modal -->
    <div id="dhcpModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full">
        <div class="relative top-10 mx-auto p-5 border w-3/4 max-w-4xl shadow-lg rounded-md bg-white"><!-- Content omitted in patch; restored by remainder --></div>
    </div>

    <!-- Add/Edit User Modal -->
    <div id="addUserModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full"><!-- Modals unchanged --></div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full"><!-- Modals unchanged --></div>

    <script>
        const API_BASE = window.location.origin;
    </script>
</body>
</html>
